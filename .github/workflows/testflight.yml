# Ship PockeDev to TestFlight from GitHub Actions.
#
# Native Swift + XcodeGen — not Flutter. Same pipeline as scripts/ship-ios.sh:
#   bump/set build number → xcodegen → xcodebuild archive → export IPA → altool
#
# Trigger: Actions → TestFlight → Run workflow
# Optional: push a v* tag (e.g. v1.0.0)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID          App Store Connect API Key ID (10 chars)
#   ASC_ISSUER_ID       App Store Connect Issuer ID (UUID)
#   ASC_AUTH_KEY_B64    base64 of AuthKey_<id>.p8   (base64 -i AuthKey_XXX.p8)
#   IOS_DIST_CERT_P12_B64   Apple Distribution cert exported as .p12, base64
#   IOS_DIST_CERT_PASSWORD  password for that .p12
# Same names as tb-mobile, so the same values can be reused. Locally nothing
# changes: ship-ios.sh uses the login-keychain cert and .env.signing.
#
# Optional:
#   ASC_TEAM_ID         defaults to GUW6BN8X57
#   vars.TESTFLIGHT_BUILD_OFFSET  added to github.run_number so CI builds stay
#                                 above locally shipped CURRENT_PROJECT_VERSION

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      archive_only:
        description: "Archive and export IPA without uploading"
        type: boolean
        default: false
      build_number:
        description: "Override CFBundleVersion (empty = offset + run number)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  ship:
    name: Build IPA and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write        # push the build-number bump branch
      pull-requests: write   # open and merge the bump PR
    env:
      # Pin the toolchain the app is built with locally (Xcode 26.6). macos-15 tops
      # out at Xcode 16.4, whose SDK lacks APIs the sources use.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_AUTH_KEY_B64 }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 IOS_DIST_CERT_P12_B64 IOS_DIST_CERT_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name secret is not set"
              missing=1
            fi
          done
          exit $missing

      # Gitty is declared as git@github.com:RonenMars/Gitty.git in project.yml.
      # SPM on CI should fetch over HTTPS.
      - name: Rewrite SSH GitHub URLs for SwiftPM
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import Apple Distribution certificate
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"
          printf '%s' "$IOS_DIST_CERT_P12_B64" | base64 -d > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Verify distribution identity
        run: |
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -qi "Apple Distribution" \
            || { echo "::error::No Apple Distribution identity in the keychain"; exit 1; }

      - name: Resolve build number
        id: version
        run: |
          cur=$(grep -E 'CURRENT_PROJECT_VERSION:' project.yml | grep -oE '[0-9]+' | head -1)
          offset="${{ vars.TESTFLIGHT_BUILD_OFFSET }}"
          offset="${offset:-0}"
          input="${{ github.event.inputs.build_number }}"
          if [[ -n "$input" ]]; then
            next="$input"
          else
            next=$(( offset + ${{ github.run_number }} ))
          fi
          if (( next <= cur )); then
            echo "::warning::Computed build $next is not greater than project.yml ($cur). Bumping to $((cur + 1)). Set vars.TESTFLIGHT_BUILD_OFFSET if this keeps happening."
            next=$(( cur + 1 ))
          fi
          echo "build_number=$next" >> "$GITHUB_OUTPUT"
          echo "Using CURRENT_PROJECT_VERSION=$next (was $cur)"

      - name: Ship
        id: ship
        run: |
          extra=()
          extra+=(--build-number "${{ steps.version.outputs.build_number }}")
          if [[ "${{ github.event.inputs.archive_only }}" == "true" ]]; then
            extra+=(--archive-only)
          fi
          ./scripts/ship-ios.sh "${extra[@]}"
          # ship-ios.sh may raise the number past what App Store Connect already has.
          echo "build_number=$(grep -E 'CURRENT_PROJECT_VERSION:' project.yml | grep -oE '[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      # main's project.yml otherwise falls behind TestFlight (the job never commits
      # its own checkout). Only the one line lands, on top of origin/main, so a
      # tag or branch build never leaks other changes. Needs "Allow GitHub Actions
      # to create and approve pull requests" and no required checks on main.
      - name: Open and merge build number bump PR to main
        if: success() && github.event.inputs.archive_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHIPPED: ${{ steps.ship.outputs.build_number }}
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_BN=$(git show origin/main:project.yml | grep -E 'CURRENT_PROJECT_VERSION:' | grep -oE '[0-9]+' | head -1)
          if (( SHIPPED <= MAIN_BN )); then
            echo "main already at build $MAIN_BN (shipped $SHIPPED) — nothing to do"
            exit 0
          fi
          BRANCH="chore/bump-build-number-${SHIPPED}"
          TITLE="chore(ios): bump build number to ${SHIPPED}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add "$RUNNER_TEMP/bump" origin/main
          (
            cd "$RUNNER_TEMP/bump"
            sed -i '' -E "s/(CURRENT_PROJECT_VERSION: )\"?[0-9]+\"?/\1\"${SHIPPED}\"/" project.yml
            git commit -am "$TITLE"
            git push --force origin "HEAD:refs/heads/${BRANCH}"
          )
          git worktree remove --force "$RUNNER_TEMP/bump"
          gh pr create --base main --head "$BRANCH" --title "$TITLE" \
            --body "Automated bump after build ${SHIPPED} uploaded to TestFlight (run ${{ github.run_id }})." \
            || echo "PR for $BRANCH already exists"
          gh pr merge "$BRANCH" --squash --delete-branch --subject "$TITLE"
          echo "- Bumped main to build \`${SHIPPED}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PockeDev-${{ steps.ship.outputs.build_number || steps.version.outputs.build_number }}
          path: build/export/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: success()
        run: |
          {
            echo "## TestFlight"
            echo "- Marketing version: \`$(grep MARKETING_VERSION project.yml | head -1)\`"
            echo "- Build number: \`${{ steps.ship.outputs.build_number }}\`"
            echo "- IPA: \`build/export/PockeDev.ipa\`"
            if [[ "${{ github.event.inputs.archive_only }}" == "true" ]]; then
              echo "- Upload skipped (\`archive_only\`)"
            else
              echo "- Uploaded via \`xcrun altool\`. Apple processing usually takes 5–15 minutes before the build is Ready to Test."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
